{# One form field with Bootstrap markup. Expects `field` in the context. #}
<label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
{{ field }}
{% if field.help_text %}
  <div class="form-text">{{ field.help_text }}</div>
{% endif %}
{% if field.errors %}
  {# Django points the widget's aria-describedby at this id. #}
  <div id="{{ field.auto_id }}_error" class="invalid-feedback d-block">
    {% for error in field.errors %}<div>{{ error }}</div>{% endfor %}
  </div>
{% endif %}
